<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: curiosidades das notas de Robótica 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,700&display=swap">
<style>
:root{--brand:#0e4194;--green:#68b42d;--greent:#2f7a0b;--orange:#e8490f;--orangt:#b8340a;--amber:#f2a900;--ink:#102a4c;--mute:#566780;--line:#d3deec;--bg:#eaf0f9;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.top{position:relative;background:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 24px 0;min-height:128px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#0e4194 0 84%,#68b42d 84% 92%,#e8490f 92% 100%)}
.brand{padding-bottom:18px}
.logo{display:block;height:30px;margin-bottom:10px}
h1{margin:0;font-size:1.6rem;font-style:italic;color:var(--brand);line-height:1.15}
.sub{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.mascote{height:140px;margin-bottom:-20px;position:relative;z-index:2;filter:drop-shadow(0 6px 6px rgba(14,65,148,.22))}
main{max-width:760px;margin:0 auto;padding:34px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.prog{display:flex;gap:5px;margin-bottom:16px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.now{background:var(--brand)}.prog i.ok{background:var(--green)}.prog i.no{background:var(--orange)}
.cnt{color:var(--mute);font-size:.9rem;margin:0 0 6px}
h2{margin:0 0 16px;font-size:1.3rem;line-height:1.3}
.opts{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f1f6ff}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--brand);display:grid;place-items:center}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:#eef9e4}.opt.right b{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--orange);background:#fff0ea}.opt.wrong b{background:var(--orange);color:#fff}
.opt.dim{opacity:.55}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.fb{margin-top:16px;padding:14px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.fb.ok{border-color:var(--green)}.fb.no{border-color:var(--orange)}
.fb strong{display:block}.fb.ok strong{color:var(--greent)}.fb.no strong{color:var(--orangt)}
.hint{margin-top:12px;color:var(--mute)}
.res{text-align:center}
.res .big{font-size:3.4rem;font-weight:700;font-style:italic;color:var(--brand);line-height:1}
.res img{height:170px;margin:6px 0}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem;font-weight:700}
@media(max-width:600px){.top{padding:10px 14px 0;min-height:100px}.mascote{height:92px;margin-bottom:-14px}h1{font-size:1.2rem}.logo{height:24px}.card{padding:16px}h2{font-size:1.15rem}}
@media(prefers-reduced-motion:no-preference){.fb{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

<script>
const Q=[{"p":"Qual é o primeiro nome mais comum entre os 366 alunos?","o":["João","Maria","Ana","Alice"],"a":1,"h":"A diferença para o segundo colocado é de apenas 1 aluno.","e":"Maria aparece 20 vezes. Em seguida vêm João (19) e Ana (18).","c":"Isso mesmo!"},{"p":"Quantos alunos têm o nome completo exatamente igual ao de outro aluno?","o":["Nenhum","2","6","12"],"a":0,"h":"Repetir o primeiro nome é comum, mas o nome completo é outra história.","e":"Nenhum nome completo se repete. O que se repete é o primeiro nome: 267 dos 366 alunos (73%) dividem o primeiro nome com alguém.","c":"Certo!"},{"p":"Qual turma tem a maior média de notas?","o":["6º A","5º ano","2º ano","7º B"],"a":2,"h":"É uma turma do primeiro ciclo do fundamental.","e":"O 2º ano tem média 90,61, bem acima do 6º A (87,18) e do 5º ano (86,37).","c":"Na mosca!"},{"p":"Qual turma tem mais alunos?","o":["4º ano","5º ano","6º A","7º A"],"a":3,"h":"É uma turma do matutino.","e":"O 7º A tem 36 alunos. O 4º e o 5º ano têm 34 cada, e o 6º A tem 32.","c":"Acertou!"},{"p":"Em qual turma há mais alunos que dividem o primeiro nome com algum colega da própria turma?","o":["1º ano","9º B","5º ano","6º B"],"a":2,"h":"Uma das turmas tem 4 alunos chamados Arthur.","e":"No 5º ano, 17 alunos dividem o primeiro nome (há 4 Arthurs, 3 Alices, 3 Heitores e 3 Marias). O 9º B não tem nenhuma repetição.","c":"Muito bem!"},{"p":"Estimando pelo primeiro nome, quantas meninas há entre os 366 alunos?","o":["174","183","192","201"],"a":2,"h":"Há um pouco mais meninas do que meninos.","e":"São 192 meninas (52%) e 174 meninos (48%). O diário não informa o sexo do aluno, então a contagem é uma estimativa feita pelo primeiro nome.","c":"Isso aí!"},{"p":"Entre meninos e meninas, quem tem a maior média geral?","o":["Meninas, por menos de 1 ponto","Meninos, por menos de 1 ponto","Meninas, por mais de 5 pontos","Meninos, por mais de 5 pontos"],"a":1,"h":"A diferença é minúscula.","e":"Os meninos ficaram com 82,64 e as meninas com 82,37, uma diferença de 0,27 ponto. Na prática, é um empate.","c":"Correto!"},{"p":"Qual ano do fundamental tem a menor média de notas?","o":["4º ano","8º ano","9º ano","1º ano"],"a":2,"h":"É o último ano do fundamental.","e":"O 9º ano tem média 69,9, a mais baixa. O 8º ano tem 80,2 e o 4º ano tem 79,8.","c":"Certo!"},{"p":"Qual avaliação teve a maior média geral entre todos os alunos?","o":["1ª avaliação","2ª avaliação","3ª avaliação","As três tiveram a mesma média"],"a":1,"h":"Ela fica no meio.","e":"As médias foram 83,4 na 1ª, 85,0 na 2ª e 81,0 na 3ª. A 3ª avaliação caiu.","c":"Isso mesmo!"},{"p":"Quantas notas 100 foram lançadas, somando a 1ª, a 2ª e a 3ª avaliações de todos os alunos?","o":["42","78","120","156"],"a":1,"h":"É mais de 50 e menos de 100.","e":"Foram 78 notas 100 ao todo.","c":"Mandou bem!"}];
const L='ABCD',$=id=>document.getElementById(id);
let i=0,score=0,res=[];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function prog(){const p=el('div','prog');Q.forEach((_,k)=>p.append(el('i',k<res.length?(res[k]?'ok':'no'):k===i?'now':'')));return p}
function show(){
  const q=Q[i],c=$('c');c.replaceChildren(prog(),el('p','cnt','Pergunta '+(i+1)+' de '+Q.length),el('h2','',q.p));
  const ul=el('ul','opts');let done=false;const fbBox=el('div');
  const next=el('button','btn',i<Q.length-1?'Próxima pergunta':'Ver resultado');
  const hb=el('button','btn ghost','Ver dica'),hint=el('p','hint');
  q.o.forEach((t,k)=>{
    const li=el('li'),b=el('button','opt');b.type='button';b.append(el('b','',L[k]),el('span','',t));
    b.onclick=()=>{
      if(done)return;done=true;const ok=k===q.a;if(ok)score++;res.push(ok);
      ul.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;x.classList.add(j===q.a?'right':j===k?'wrong':'dim')});
      const f=el('div','fb '+(ok?'ok':'no'));f.append(el('strong','',ok?q.c:'Resposta certa: '+L[q.a]+') '+q.o[q.a]),el('span','',q.e));
      fbBox.replaceChildren(f);hb.hidden=true;hint.textContent='';next.hidden=false;next.focus();
      c.firstChild.replaceWith(prog());
    };
    li.append(b);ul.append(li);
  });
  hb.type=next.type='button';next.hidden=true;
  hb.onclick=()=>{hint.textContent='Dica: '+q.h;hb.hidden=true};
  next.onclick=()=>{i++;i<Q.length?show():end()};
  const bar=el('div','bar');bar.append(hb,next);
  c.append(ul,hint,fbBox,bar);
}
function end(){
  const c=$('c');c.replaceChildren();
  const m=score>=9?'Parabéns! Você é craque nas notas da Robótica!':score>=6?'Muito bem! Você conhece bem os números da escola.':score>=3?'Bom começo! Que tal tentar de novo?':'Os números da Robótica guardam muitas surpresas. Tente outra vez!';
  const d=el('div','dots');res.forEach((ok,k)=>{const s=el('span','',k+1);s.style.background=ok?'#4a9a1c':'#e8490f';s.title='Pergunta '+(k+1)+(ok?': acertou':': errou');d.append(s)});
  const w=el('div','res');const im=document.querySelector('.mascote').cloneNode();
  const b=el('button','btn','Jogar de novo');b.type='button';b.onclick=()=>{i=0;score=0;res=[];show()};
  w.append(el('p','cnt','Seu resultado'),el('div','big',score+' / '+Q.length),im,el('h2','',m),d,b);
  c.append(w);b.focus();
}
show();
</script>
